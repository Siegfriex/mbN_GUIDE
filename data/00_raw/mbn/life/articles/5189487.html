		function jsonp(uri) {
 	    return new Promise(function(resolve, reject) {
 	        var id = '_' + Math.round(10000 * Math.random());
 	        var callbackName = 'jsonp_callback_' + id;
 	        window[callbackName] = function(data) {
 	            delete window[callbackName];
 	            var ele = document.getElementById(id);
 	            ele.parentNode.removeChild(ele);
 	            resolve(data);
 	        }

 	        var src = uri + '&callback=' + callbackName;
 	        var script = document.createElement('script');
 	        script.src = src;
 	        script.id = id;
 	        script.addEventListener('error', reject);
 	        (document.getElementsByTagName('head')[0] || document.body || document.documentElement).appendChild(script)
 	    });
 	}

                    <p>
                        <p></p><div style="display:box;border-left:solid 4px rgb(228, 228, 228);padding-left: 20px; padding-right: 20px;">기도 근육 약하면 코골이 심화 <br>혀, 입, 목 운동으로 기도 근육 강화<br>정도 심하면 적극적 치료 필요</div><br />
코골이의 원인을 한마디로 정리하면 기도가 좁아졌기 때문이다. 낮 동안은 별문제가 없지만, 전신이 이완되는 수면 중에는 기도가 더욱 좁아져 코골이가 심해지고, 기도가 막히는 수면무호흡증까지 유발한다. 기도 근육을 단단히 붙들어야 한다.<br />
<table width="500" style="margin:0 auto; clear:both; max-width: 100%" cellpadding="0" cellspacing="0" border="0" align="center"><tbody><tr><td align="center" style="padding:10px 0 5px 0;"><img  class="lazy" src="//img.mbn.co.kr/newmbn/white.PNG" data-src="//img.mbn.co.kr/filewww/news/other/2026/04/21/062164202126.png" width="500"  alt="(사진 프리픽)"  border="0" /></td></tr><tr><td style="padding-bottom:10px; color:#666; line-height:17px; font-size:12px; font-family:'돋움';">↑ (사진 프리픽)</td></tr></tbody></table><strong><div style="border-top: 4px solid #ed6d01;border-bottom: 1px solid #ed6d01;font-size: 18px;padding: 10px 0;margin:30px 0;">기도 근육 약하면 코골이 심해져</div></strong>기도는 상기도와 하기도로 나뉘며, 코골이는 상기도와 관련 있다. 목젖과 혀가 있는 상기도는 근육으로만 이루어져 있는데, 이 근육이 힘을 잃고 이완되면 기도가 좁아진다. 좁은 기도를 통과하려면 공기 흐름이 빨라지고 주변 조직이 심하게 떨리는데 이 떨림음이 코골이로 나타나는 것. 바꾸어 말해 기도 근육이 탄탄해서 통로를 충분히 확보하면 코골이가 완화된다는 이야기다.<br />
이처럼 코골이와 근육과의 상관성으로 보면, 코골이가 심해지는 상황이 쉽게 이해된다. 피곤할 때, 술을 마셨을 때, 담배를 피웠을 때, 살이 쪘을 때 그리고 노화가 진행될 때 등이다. 이들에서는 근육 이완, 근육 약화, 근육량 감소라는 공통점을 발견할 수 있다. 음주는 기도 근육을 과하게 이완시키고, 흡연은 기도에 부종을 일으키며, 비만은 지방이 기도를 좁힌다. 따라서 목젖이 길거나, 연구개가 늘어졌거나, 편도가 비대하거나, 혀가 너무 크거나 하악각이 좁은 등의 구조적 이상이 아니라면, 생활 습관을 바꾸고 근육 강화 운동을 함으로써 코골이 완화도 가능한 셈이다.<br />
<strong><div style="border-top: 4px solid #ed6d01;border-bottom: 1px solid #ed6d01;font-size: 18px;padding: 10px 0;margin:30px 0;">혀, 입, 목 운동으로 기도 근육 강화해야</div></strong>기도 근육의 힘을 키우는 ‘혀 운동’부터 시작해 보자. 혀끝을 윗니 안쪽에 대고 나머지 혀를 입천장으로 밀어 올려 힘을 준다. 입천장 앞쪽에서 뒤쪽으로 혀끝을 쓸어내린다. 혀를 입 밖으로 쭉 내밀어 10초간 유지한다. 혀를 동서남북 방향으로 길게 뻗어준다. 다음으로 ‘목 운동’. 양손을 가슴에 대고 고개를 뒤로 젖혀 10초간 유지한다. 턱을 몸 쪽으로 당긴 상태에서 뒷목을 잡고 아래로 10초간 지그시 누른다.<br />
‘입 운동’도 해 보자. 입을 앙다물고 양쪽 입꼬리를 최대한 당겨 10초간 머물렀다가 천천히 푼다. 앞니로 볼펜을 물고 입을 꽉 닫아 10초 유지한 뒤 볼펜을 빼고 입을 풀어 준다. 당연히 ‘전신 근력 운동’도 도움이 된다. 전신 근력 운동은 자연스럽게 기도 근육을 강화하고, 체중 감량 효과도 있어 코골이를 한층 개선할 수 있다.<br />
이 밖에 잠잘 때 모로 눕고 머리를 높이면 코골이가 완화된다. 체중 감량도 중요하다. 체중이 10% 줄면 증상이 절반가량 호전된<div style='padding-right:15px; text-align:left; float:left; margin-right:5px; margin-bottom:10px'><br />
			<div id='google_dfp_MC_250x250'><script type='text/javascript'>googletag.display('google_dfp_MC_250x250'); </script></div></div>다. 수면 중 구강 내 장치나 비강 내 장치를 착용해 기도를 넓힐 수도 있다. 하지만 정도가 심해 주변인의 수면을 해치거나 스스로도 숙면이 어려워 일상 활동에 지장이 있다면, 또는 폐쇄성 무호흡증을 동반한다면 병원을 방문해 적극적으로 치료해야 한다.<br />

        $(function () {
            var left = $("#content");
            var right = $(".aside_area");
            var win = $(window);
            var header = $("#header");
            var footer = $("#footer_newsmain");
            var container = $("#container");
            var margin = header.height() + 115;

            function rightLong() {
                var leftWidth = "";

                if (win.width() < container.width()) {
                    leftWidth = -(win.scrollLeft());
                }

                var winHeight = win.scrollTop() + win.height();
                var bottomHeight = winHeight - (right.height() + margin);
                bottomHeight = (bottomHeight > 0) ? bottomHeight : 0;

                if (winHeight > left.height() + margin + 25) {
                    left.css({left: leftWidth, position: 'fixed', bottom: bottomHeight + 'px'});
                } else {
                    left.css({left: 'auto', position: 'relative', bottom: 'auto'});
                }

                //right.css({position: 'relative', bottom: 'auto'});
            }

            function leftLong() {

                var leftWidth = left.width();
                var compareWidth = win.width() - container.width() + left.width();

                if (compareWidth > left.width()) {
                    leftWidth = leftWidth + 16 + (compareWidth - leftWidth) / 2;
                } else {
                    leftWidth = leftWidth + 16 - win.scrollLeft();
                }

                var winHeight = win.scrollTop() + win.height();
                var bottomHeight = winHeight - (left.height() + margin);
                bottomHeight = (bottomHeight > 0) ? bottomHeight : 0;

                if (winHeight > right.height() + margin) {
                    right.css({left: leftWidth, position: 'fixed', bottom: bottomHeight + 'px'});
                } else {
                    right.css({left: 'auto', position: 'relative', bottom: 'auto'});
                }

                //left.css({position: 'relative', bottom: 'auto'});
            }

            $(window).on("load scroll resize", function () {

                if (left.height() < right.height()) {
                    rightLong();
                } else {
                    leftLong();
                }
            });
        });

    </script>

<script>
    (function () {
        //기사 하이라이트 표시 20241120
        const options = {
            root: null,
            rootMargin: '0px',
            threshold: 0.5,
        }


        const newsLinesWithTargetTag = document.querySelectorAll('#newsViewArea b, #newsViewArea strong')
        const newsHighLightsObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('on');
                    observer.unobserve(entry.target);
                }
            });
        }, options)

        newsLinesWithTargetTag.forEach((line) => {
            newsHighLightsObserver.observe(line);
        })
    })();
</script>
